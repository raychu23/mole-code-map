name: release-container

# Builds deploy/Dockerfile (the team server) and pushes it to GHCR on a version tag.
# Uses only the repo-scoped GITHUB_TOKEN (no PAT, no long-lived secret): GITHUB_TOKEN gets
# packages:write via the job `permissions` block below, which is enough to push to
# ghcr.io/<owner>/mole-server (GitHub Container Registry docs, fetched 2026-11-03,
# docs.github.com/en/actions/publishing-packages/publishing-docker-images).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raychu23/mole-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
